name: CI

# Runs on every push to main and every pull request. Unlike release.yml
# (tag-triggered artifact build), this is the PR/push gate: engine tests,
# vet, lint, and the tygo TS-contract-drift check, plus the UI lint/test/
# build suite — all of which were previously hand-run only.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: go test (full)
        run: make -C engine test

      - name: go test -race (short)
        run: make -C engine test-race

      - name: go vet
        run: make -C engine vet

      # engine/.golangci.yml is v2 schema (version: "2") -- a v1 lint binary
      # rejects it, so this must install golangci-lint 2.x. golangci-lint-action
      # v7+ is dedicated to golangci-lint v2 (v6 and earlier only support v1).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: engine

      # Regenerates ui/src/gen/wsmsg.ts via `go tool tygo generate` and fails
      # if it drifts from the committed copy -- needs the ui/ tree, which the
      # checkout above already provides.
      - name: TS contract drift check (gen-ts-check)
        run: make -C engine gen-ts-check

  engine-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Profile recorder capacity
        continue-on-error: true
        working-directory: engine
        run: |
          $profileDir = Join-Path $env:RUNNER_TEMP 'recorder-profile'
          New-Item -ItemType Directory -Path $profileDir -Force | Out-Null
          Write-Host "[DEBUG-recorder] TMP=$env:TMP TEMP=$env:TEMP RUNNER_TEMP=$env:RUNNER_TEMP CPUs=$env:NUMBER_OF_PROCESSORS"
          go test ./internal/tickstore -run '^TestRecordingLoadComparison$/(recording|profiles)$' -count=1 -v "-cpuprofile=$profileDir/cpu.pprof" "-blockprofile=$profileDir/block.pprof" "-mutexprofile=$profileDir/mutex.pprof" "-trace=$profileDir/runtime.trace" "-o=$profileDir/tickstore.test.exe"
          $benchmarkExit = $LASTEXITCODE
          foreach ($profile in @('cpu', 'block', 'mutex')) {
            go tool pprof -top -nodecount=20 "$profileDir/tickstore.test.exe" "$profileDir/$profile.pprof"
          }
          exit $benchmarkExit

      - name: go test (full)
        working-directory: engine
        # Capacity tests must not compete with other package load generators.
        run: go test -p 1 ./...

      - name: Upload recorder diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorder-profile
          path: ${{ runner.temp }}/recorder-profile/
          retention-days: 3

  ui:
    # Golden PNGs are generated on Windows. Cairo/Pango text rasterization is
    # OS-specific even with the same bundled TTF, so strict pixel comparison
    # must run on the baseline platform.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Test
        working-directory: ui
        run: npm test

      # Build already runs typecheck (npm run typecheck && vite build).
      - name: Build
        working-directory: ui
        run: npm run build
